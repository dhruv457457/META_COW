type Pair {
  id: ID!
  tokenA: String!
  tokenB: String!
  reserveA: BigInt!
  reserveB: BigInt!
  totalSwaps: Int!
  volume24h: BigInt!
  lastSyncAt: Int!
}

type SwapEvent {
  id: ID!
  pairAddress: String!
  user: String!
  inputToken: String!
  outputToken: String!
  inputAmount: BigInt!
  outputAmount: BigInt!
  timestamp: Int!
  txHash: String!
  blockNumber: Int!
}