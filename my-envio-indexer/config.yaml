# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: metacow-indexer
networks:
  - id: 97 # BNB Testnet
    start_block: 46000000
    contracts:
      # Factory Contract (fixed address)
      - name: MetaCowFactory
        address:
          - "0x524Fec22546B087E91D198745CdD6ea94C057D79"
        abi_file_path: abis/Factory.json
        handler: src/EventHandlers.ts
        events:
          - event: PairCreated(address indexed token0, address indexed token1, address pair, uint256)
      
      # Dynamic Pair Contracts - MUST have empty address array
      - name: MetaCowPair
        address: []  # ✅ EXPLICITLY ADD THIS LINE
        abi_file_path: abis/Pair.json
        handler: src/EventHandlers.ts
        events:
          - event: Swap(address indexed sender, uint256 amount0In, uint256 amount1In, uint256 amount0Out, uint256 amount1Out, address indexed to)
            field_selection:
              transaction_fields:
                - hash
          - event: Sync(uint112 reserve0, uint112 reserve1)