# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: metacow-indexer
networks:
  - id: 97 # BNB Testnet
    start_block: 46000000
    contracts:
      # Factory Contract
      - name: MetaCowFactory
        address:
          - "0x524Fec22546B087E91D198745CdD6ea94C057D79"
        abi_file_path: abis/Factory.json
        handler: src/EventHandlers.ts
        events:
          - event: PairCreated(address indexed tokenA, address indexed tokenB, address pairAddress, uint256 index)
      
      # Dynamic Pair Contracts
      - name: MetaCowPair
        address: []
        abi_file_path: abis/Pair.json
        handler: src/EventHandlers.ts
        events:
          # ✅ CORRECT event signature from your contract
          - event: Swapped(address indexed user, address indexed inputToken, address indexed outputToken, uint256 inputAmount, uint256 outputAmount)
            field_selection:
              transaction_fields:
                - hash
          # ✅ CORRECT event signature
          - event: ReserveSynced(uint256 reserveA, uint256 reserveB)